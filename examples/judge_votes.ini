; A study of how the judges of the federal courts of appeals vote in criminal
; appeals: whether a judge votes to reverse, given who the judge is, who else
; is on the panel, and who is president.
;
; Before the first run, make a roster of judges, which downloads three small
; files from the Federal Judicial Center and saves the roster where CourtPy
; looks for it:
;
;     import courtpy
;     courtpy.judges.Roster.from_fjc().save()
;
; Then run the study from a terminal, in the folder that holds this file:
;
;     courtpy run judge_votes.ini --export
;
; or from Python:
;
;     project = courtpy.Project.create('judge_votes.ini')
;
; As in "federal_appeals.ini", the first run extracts the cases from
; CourtListener's bulk data, which takes a few hours but needs no API key.
; The cases are saved in "data/court_listener", the table of votes in
; "data/votes.csv", and later runs reuse the table.

[general]
seed = 43
; Whether each judge voted to reverse: the outcome of the case, or its
; opposite for a judge who dissented.
label = vote_reversal
; The judges of a case decide it together, so the rows of a case are kept
; together when the data is split.
groups = case_id

[files]
input_folder = data
interim_folder = data
output_folder = results

[votes_project]
votes_workers = wrangler, explorer, analyst, critic

[wrangler]
techniques = load_court_listener, filter_rows, keep_columns, drop_missing

[load_court_listener_parameters]
source = court_listener
download = bulk
courts = federal_circuits
start_date = 2019-01-01
end_date = 2019-12-31
rulebooks = federal
; After the usual coders, "code_judges" finds each panel's judges in the
; roster, "code_politics" adds the party of the president, and "judge_votes"
; makes one row for each judge on each case. They are built from the mergers
; and shapers of amos, which join tables whose rows are different things
; (cases, judges, and years).
coders = code_parties, code_case_type, code_outcome, code_judges, code_politics, judge_votes
save = votes.csv
reuse = true

; Criminal appeals decided by panels of three judges, all of whom were found
; in the roster.
[filter_rows_parameters]
query = type_criminal and panel_size == 3 and panel_found == 3

; The features: the circuit, the year, who brought the appeal, the judge, and
; the other two judges of the panel. Columns that record the outcome itself
; are left out, because they would give the answer away.
[keep_columns_parameters]
columns = court_num, year, appeal_by_defendant, politics_president_party, judge_party, judge_woman, judge_minority, judge_age, judge_senior, judge_designated, judge_prosecutor, judge_public_defender, colleagues_party, colleagues_woman, colleagues_minority, colleagues_prosecutor, colleagues_public_defender

[explorer]
techniques = summarize, label_balance

; "group_split" keeps the rows of each case (the study's group) together, so
; that a model is tested on cases it has not seen.
[analyst]
design = experiment
criterion = roc_auc
steps = split, model
split_techniques = group_split
model_techniques = baseline, logit, random_forest

[random_forest_parameters]
n_estimators = 200

[critic]
techniques = scorecard

; A scorecard compares a model across a study's groups unless its metrics are
; named. The groups here are cases, so that comparison would mean nothing
; (and it needs the optional fairlearn package).
[scorecard_parameters]
metrics = roc_auc, accuracy, balanced_accuracy, f1
