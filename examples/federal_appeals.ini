; A study of which appeals in the federal courts of appeals end in reversal.
;
; Run it from a terminal, in the folder that holds this file:
;
;     courtpy run federal_appeals.ini --export
;
; or from Python:
;
;     import courtpy
;     project = courtpy.Project.create('federal_appeals.ini')
;
; The first run extracts the cases from CourtListener's bulk data, which takes
; a few hours (the opinions file alone is more than 50 GB) but needs no API
; key. The cases are saved in "data/court_listener", the coded table in
; "data/cases.csv", and later runs reuse the table.

[general]
seed = 43
label = outcome_reversal

; The clerk looks for (and saves) the cases in the input folder, saves the
; coded table in the interim folder, and exports results to the output folder.
[files]
input_folder = data
interim_folder = data
output_folder = results

[appeals_project]
appeals_workers = wrangler, explorer, analyst, critic

; The wrangler first loads the cases, then keeps the decisions by panels of
; three judges and the features below.
[wrangler]
techniques = load_court_listener, filter_rows, keep_columns, drop_missing

; Which cases to load, and how to collect, parse, and code them.
[load_court_listener_parameters]
; The folder of saved cases, in the input folder.
source = court_listener
; "bulk" extracts cases from CourtListener's bulk data (no key needed).
; "api" downloads them with your API key (run "courtpy key set" first), which
; is best for small or very recent sets of cases.
; "none" parses the cases already in the folder.
download = bulk
courts = federal_circuits
start_date = 2019-01-01
end_date = 2019-12-31
rulebooks = federal
save = cases.csv
reuse = true

[filter_rows_parameters]
query = panel_size == 3

; The features: the circuit, the year, the parties, the counsel, the issues,
; and the opinions. Columns that record the outcome itself (the disposition
; and the opinion's "we reverse") are left out, because they would give the
; answer away.
[keep_columns_parameters]
columns = court_num, year, published, type_criminal, party1_united_states, party2_united_states, party1_appealing, party2_appealing, counsel_us_attorney, counsel_public_defender, concurrences, dissents, word_count, criminal_sentencing, criminal_drugs, criminal_firearm, civil_habeas, civil_sec1983, civil_qual_imm, civil_titlevii, general_amend4, procedure_pro_se, standard_de_novo, standard_abuse_disc

[explorer]
techniques = summarize, label_balance

; "sk_logit" is scikit-learn's logistic regression. ("logit" is the
; statsmodels model, with a table of coefficients, which needs the optional
; statsmodels package: pip install amos[statistics].)
[analyst]
design = experiment
criterion = roc_auc
steps = split, model
split_techniques = stratified
model_techniques = baseline, sk_logit, random_forest

[random_forest_parameters]
n_estimators = 200

[critic]
techniques = scorecard
